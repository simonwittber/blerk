[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blerk"
version = "0.5.1"
requires-python = ">=3.11"
dependencies = [
    "sqlite-vec",
    "watchdog",
    "tree-sitter",
    "tree-sitter-python",
    "tree-sitter-javascript",
    "tree-sitter-c",
    "tree-sitter-cpp",
    "tree-sitter-c-sharp",
    "tree-sitter-go",
    "tree-sitter-hlsl",
    "tree-sitter-glsl",
    "httpx",
    "mcp",
    "tomli_w",
    "sentence-transformers",
    "torch",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
blerk            = "blerk_cmd.main:main"
blerk-hub        = "blerk_cmd.hub:main"
blerk-watch      = "blerk_cmd.watch_folder:main"
blerk-symbolize  = "blerk_cmd.symbolizer:main"
blerk-git        = "blerk_cmd.git_enricher:main"
blerk-describe   = "blerk_cmd.llm_describer:main"
blerk-embed      = "blerk_cmd.embedder:main"
blerk-mcp        = "blerk_cmd.mcp_server:main"
blerk-rescan     = "blerk_cmd.rescan:main"
blerk-reindex    = "blerk_cmd.reindex:main"
blerk-lint       = "blerk_cmd.lint:main"
blerk-fingerprint   = "blerk_cmd.fingerprinter:main"

[tool.setuptools.packages.find]
include = ["blerk*", "blerk_cmd*"]
